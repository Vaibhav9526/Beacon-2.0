name: beacon

services:
  postgis:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: beacon
      POSTGRES_USER: beacon
      POSTGRES_PASSWORD: beacon
    ports:
      - "5432:5432"
    volumes:
      - beacon_postgis:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beacon -d beacon"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "6379:6379"
    volumes:
      - beacon_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  textbelt:
    build:
      context: ./vendor/textbelt
      dockerfile: Dockerfile
    environment:
      PORT: 9090
      TEXTBELT_SMTP_HOST: ${TEXTBELT_SMTP_HOST:-}
      TEXTBELT_SMTP_PORT: ${TEXTBELT_SMTP_PORT:-587}
      TEXTBELT_SMTP_USER: ${TEXTBELT_SMTP_USER:-}
      TEXTBELT_SMTP_PASS: ${TEXTBELT_SMTP_PASS:-}
      TEXTBELT_SMTP_SECURE: ${TEXTBELT_SMTP_SECURE:-false}
      TEXTBELT_FROM: ${TEXTBELT_FROM:-BEACON <beacon@localhost.invalid>}
    ports:
      # Textbelt has no built-in authentication. Keep its diagnostic port local;
      # the authenticated API reaches it over the private Compose network.
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9090/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://beacon:beacon@postgis:5432/beacon
      REDIS_URL: redis://redis:6379
      PORT: 8000
      HOST: 0.0.0.0
      UPLOAD_DIR: /app/data/uploads
      UPLOAD_MAX_FILE_BYTES: ${UPLOAD_MAX_FILE_BYTES:-25000000}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      ALLOW_DEMO_AUTH: ${ALLOW_DEMO_AUTH:-true}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GEMINI_TRANSLATION_MODEL: ${GEMINI_TRANSLATION_MODEL:-gemini-3.5-flash-lite}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-haiku-latest}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      BHASHINI_COMPUTE_URL: ${BHASHINI_COMPUTE_URL:-}
      BHASHINI_COMPUTE_AUTH_NAME: ${BHASHINI_COMPUTE_AUTH_NAME:-}
      BHASHINI_COMPUTE_AUTH_VALUE: ${BHASHINI_COMPUTE_AUTH_VALUE:-}
      BHASHINI_NMT_SERVICE_ID: ${BHASHINI_NMT_SERVICE_ID:-}
      GOOGLE_FACT_CHECK_API_KEY: ${GOOGLE_FACT_CHECK_API_KEY:-}
      VERIFICATION_TIMEOUT_MS: ${VERIFICATION_TIMEOUT_MS:-5000}
      VERIFICATION_MAX_SOURCES: ${VERIFICATION_MAX_SOURCES:-8}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-beacon/evidence}
      CLUSTER_DISTANCE_METERS: ${CLUSTER_DISTANCE_METERS:-2500}
      CLUSTER_WINDOW_HOURS: ${CLUSTER_WINDOW_HOURS:-2}
      CLUSTER_TEXT_SIMILARITY: ${CLUSTER_TEXT_SIMILARITY:-0.38}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
      FCM_TEST_TOKENS: ${FCM_TEST_TOKENS:-}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_TEMPLATE_ID: ${MSG91_TEMPLATE_ID:-}
      MSG91_TEST_RECIPIENTS: ${MSG91_TEST_RECIPIENTS:-}
      MSG91_MESSAGE_VARIABLE: ${MSG91_MESSAGE_VARIABLE:-BEACON_MESSAGE}
      TEXTBELT_URL: http://textbelt:9090
      TEXTBELT_REGION: ${TEXTBELT_REGION:-intl}
      TEXTBELT_TEST_RECIPIENTS: ${TEXTBELT_TEST_RECIPIENTS:-}
      TEXTBELT_SMTP_HOST: ${TEXTBELT_SMTP_HOST:-}
      TEXTBELT_SMTP_USER: ${TEXTBELT_SMTP_USER:-}
      TEXTBELT_SMTP_PASS: ${TEXTBELT_SMTP_PASS:-}
    ports:
      - "8000:8000"
    volumes:
      - beacon_uploads:/app/data/uploads
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
      textbelt:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  telegram-bot:
    build:
      context: .
      dockerfile: apps/telegram-bot/Dockerfile
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_SESSION_TTL_SECONDS: ${TELEGRAM_SESSION_TTL_SECONDS:-2592000}
      TELEGRAM_HEALTH_PORT: 8082
      BEACON_API_URL: http://api:8000/api/v1
      REDIS_URL: redis://redis:6379
    ports:
      - "8082:8082"
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8082').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
    restart: unless-stopped

volumes:
  beacon_postgis:
  beacon_redis:
  beacon_uploads:
